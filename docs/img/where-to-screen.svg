<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Geist, system-ui, sans-serif" class="dg"><rect x="0" y="0" width="720" height="320" rx="14" fill="#0b0b0b"/><text x="20" y="30" text-anchor="start" font-size="15" fill="#f2f2f2" font-weight="700">Where could the screen live?</text>
<rect x="20" y="50" width="180" height="54" rx="10" fill="#2a2113" stroke="#f5b85a" stroke-width="1.6"/>
<text x="110.0" y="81.55" text-anchor="middle" font-size="14" fill="#f2f2f2" font-weight="700">Sequencer (RPC)</text>
<text x="215" y="82" text-anchor="start" font-size="12.5" fill="#f2f2f2" font-weight="400">Already screened. Never sees L1 deposits.</text>
<rect x="606.2" y="68" width="87.6" height="20.4" rx="12" fill="#2a2113" stroke="#f5b85a"/>
<text x="650" y="82.4" text-anchor="middle" font-size="12" fill="#f5b85a" font-weight="700">Not enough</text>
<rect x="20" y="116" width="180" height="54" rx="10" fill="#11241c" stroke="#6ff7b6" stroke-width="1.6"/>
<text x="110.0" y="147.55" text-anchor="middle" font-size="14" fill="#f2f2f2" font-weight="700">L1 portal (hook)</text>
<text x="215" y="148" text-anchor="start" font-size="12.5" fill="#f2f2f2" font-weight="400">Everything enters and leaves here. No consensus change.</text>
<rect x="620.12" y="134" width="59.76" height="20.4" rx="12" fill="#11241c" stroke="#6ff7b6"/>
<text x="650" y="148.4" text-anchor="middle" font-size="12" fill="#6ff7b6" font-weight="700">Chosen</text>
<rect x="20" y="182" width="180" height="54" rx="10" fill="#2a1714" stroke="#ff6a58" stroke-width="1.6"/>
<text x="110.0" y="213.55" text-anchor="middle" font-size="14" fill="#f2f2f2" font-weight="700">Derivation</text>
<text x="215" y="214" text-anchor="start" font-size="12.5" fill="#f2f2f2" font-weight="400">Consensus fork: node, fault proof program, OP Succinct.</text>
<rect x="606.2" y="200" width="87.6" height="20.4" rx="12" fill="#2a1714" stroke="#ff6a58"/>
<text x="650" y="214.4" text-anchor="middle" font-size="12" fill="#ff6a58" font-weight="700">Too costly</text>
<rect x="20" y="248" width="180" height="54" rx="10" fill="#2a1714" stroke="#ff6a58" stroke-width="1.6"/>
<text x="110.0" y="279.55" text-anchor="middle" font-size="14" fill="#f2f2f2" font-weight="700">L2 quarantine</text>
<text x="215" y="280" text-anchor="start" font-size="12.5" fill="#f2f2f2" font-weight="400">Funds would already be on the chain.</text>
<rect x="599.24" y="266" width="101.52" height="20.4" rx="12" fill="#2a1714" stroke="#ff6a58"/>
<text x="650" y="280.4" text-anchor="middle" font-size="12" fill="#ff6a58" font-weight="700">Fails req. 1</text></svg>